<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Jumão BDE</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login { border:1px solid #ccc; padding:2rem; width:320px; }
    .login h1 { font-size:1.1rem; margin-bottom:.25rem; }
    .login .sub { font-size:.8rem; color:#666; margin-bottom:1.5rem; }
    .login h2 { font-size:1rem; margin-bottom:.75rem; }
    label { font-size:.85rem; display:block; margin-top:.75rem; }
    input { padding:.4rem; border:1px solid #ccc; font-size:.85rem; width:100%; margin-top:.25rem; }
    .btn { display:block; width:100%; padding:.5rem; border:1px solid #999; background:#fff; font-size:.85rem; margin-top:1.25rem; text-align:center; }
    .back { display:block; text-align:center; margin-top:1rem; font-size:.75rem; color:#666; }
  </style>
</head>
<body>
  <div class="login">
    <h1>Jumão BDE</h1>
    <p class="sub">Portail de gestion — ISEN Brest</p>

    <h2>Connexion</h2>

    <label>Identifiant
      <input type="text" placeholder="adminbde">
    </label>

    <label>Mot de passe
      <input type="password" placeholder="••••••••">
    </label>

    <div class="btn">Se connecter</div>

    <span class="back">← Retour au portail</span>
  </div>
</body>
</html>
